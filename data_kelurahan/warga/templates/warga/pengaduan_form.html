<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container mt-4">
        <h1>Tambah Pengaduan Baru</h1>
        <hr>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_judul" class="form-label">Judul</label>
                {{ form.judul }}
            </div>
            <div class="mb-3">
                <label for="id_deskripsi" class="form-label">Deskripsi</label>
                {{ form.deskripsi }}
            </div>
            <div class="mb-3">
                <label for="id_status" class="form-label">Status</label>
                {{ form.status }}
            </div>
            <div class="mb-3">
                <label for="id_pelapor" class="form-label">Pelapor</label>
                {{ form.pelapor }}
            </div>

            <button type="submit" class="btn btn-primary">Simpan</button>
            <a href="{% url 'pengaduan-list' %}" class="btn btn-secondary">Kembali</a>
        </form>
    </div>
</body>
</html>
